[project]
name = "iiko-api"
version = "1.1.0"
description = "Библиотека для работы с iiko api"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Garik", email = "khvatik.igor@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "xmltodict>=1.0.4",
]

[tool.uv]
dev-dependencies = [
    "ruff>=0.16.2",
    "pytest>=9.1.1",
    "pytest-mock>=3.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by line-length)
]

[tool.ruff.lint.isort]
known-first-party = ["iiko_api"]
